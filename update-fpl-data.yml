name: Refresh FPL data

on:
  schedule:
    # every 30 minutes. GitHub cron is best effort and can run late.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch league data
        run: python3 fetch_data.py ${{ vars.LEAGUE_ID || 7549 }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "Refresh FPL data"
            git push
          fi
