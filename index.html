<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Of Legends — FPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#37003C;
    --purple-deep:#24002A;
    --purple-line:#55225C;
    --cyan:#04F5FF;
    --green:#00FF87;
    --pink:#E90052;
    --white:#FFFFFF;
    --dim:#C9A9CE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--purple-deep);font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--white);padding:24px 16px 48px;-webkit-font-smoothing:antialiased}
  .sheet{max-width:860px;margin:0 auto;background:var(--purple);border:1px solid var(--purple-line)}
  .pad{padding:32px}
  @media(max-width:600px){.pad{padding:20px}}

  header{border-bottom:3px solid var(--cyan)}
  .crestrow{display:flex;align-items:center;gap:28px}
  .crest{width:150px;flex:0 0 150px;height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  @media(max-width:600px){.crestrow{flex-direction:column;align-items:flex-start;gap:18px}.crest{width:108px;flex-basis:auto}}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
  h1{font-family:'Archivo Black','Archivo',sans-serif;font-size:clamp(32px,6.4vw,54px);line-height:.92;letter-spacing:-.02em;margin:10px 0 6px}
  h1 em{font-style:normal;color:var(--green)}
  .sub{font-size:15px;color:var(--dim);max-width:48ch}
  .meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:22px;font-family:'IBM Plex Mono',monospace}
  .meta div span{display:block}
  .meta .fig{font-size:26px;font-weight:600;line-height:1}
  .meta .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}

  section{border-bottom:1px solid var(--purple-line)}
  h2{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:18px;font-weight:600}
  h2 .n{color:var(--dim);margin-right:10px}

  .band{display:flex;height:78px;border:2px solid var(--white);overflow:hidden}
  .band div{display:flex;flex-direction:column;justify-content:center;padding:0 12px;min-width:0}
  .band .nm{font-family:'Archivo Black',sans-serif;font-size:clamp(11px,2vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
  .band .pc{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:5px;opacity:.85}
  .bandnote{font-size:14px;color:var(--dim);margin-top:14px}
  .bandnote b{color:var(--white);font-weight:600}

  .row{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:12px;margin-bottom:9px}
  .row .who{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .who i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-left:5px}
  .track{background:var(--purple-deep);height:20px}
  .fill{height:100%;background:var(--cyan)}
  .row .pc{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right}
  @media(max-width:600px){.row{grid-template-columns:104px 1fr 40px;gap:8px}.row .who{font-size:13px}.row .who i{display:none}}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  @media(max-width:640px){.cols{grid-template-columns:1fr;gap:26px}}

  .stat{font-family:'Archivo Black',sans-serif;font-size:44px;line-height:1;color:var(--green)}
  .stat small{font-size:16px;font-family:'IBM Plex Mono',monospace;color:var(--dim);font-weight:400}
  p.body{font-size:14px;line-height:1.55;color:var(--dim);margin-top:12px}
  p.body b{color:var(--white);font-weight:600}

  ul.list{list-style:none;margin-top:14px}
  ul.list li{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-top:1px solid var(--purple-line)}
  ul.list li span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--cyan);white-space:nowrap}
  ul.list li em{font-style:normal;color:var(--dim);font-size:12px;display:block}

  .outlier{border:2px solid var(--pink);padding:20px;background:var(--purple-deep)}
  .outlier .hd{font-family:'Archivo Black',sans-serif;font-size:clamp(20px,3.6vw,30px);line-height:1.05}
  .outlier .hd span{color:var(--pink)}
  .xi{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .xi span{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--purple-line);padding:4px 8px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 0 8px;font-weight:400}
  th:last-child,td:last-child{text-align:right}
  td{padding:8px 0;border-top:1px solid var(--purple-line)}
  td.pos{font-family:'IBM Plex Mono',monospace;color:var(--dim);width:32px}
  td.pts{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green);width:52px}
  td .tm{display:block;font-size:12px;color:var(--dim)}
  tr.you td{background:rgba(4,245,255,.08)}
  tr.you td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
  .me{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--cyan);letter-spacing:.12em;margin-left:6px}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--cyan);letter-spacing:.1em;margin-left:6px}

  .clubs{display:flex;flex-wrap:wrap;gap:8px}
  .club{font-family:'IBM Plex Mono',monospace;border:1px solid var(--purple-line);padding:8px 10px;font-size:12px}
  .club b{display:block;font-size:16px;font-family:'Archivo',sans-serif;font-weight:800}
  .club i{font-style:normal;color:var(--dim)}

  .cmpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;min-width:320px}
  .cmpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .col{border:1px solid var(--purple-line);background:var(--purple-deep)}
  select{width:100%;appearance:none;background:var(--purple);color:var(--white);border:0;border-bottom:1px solid var(--purple-line);
    font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;padding:11px 10px;cursor:pointer}
  select:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
  .colhead{padding:9px 10px;border-bottom:1px solid var(--purple-line);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);
    display:flex;justify-content:space-between;gap:6px}
  .colhead b{color:var(--cyan);font-weight:400}
  .pl{display:flex;align-items:baseline;gap:5px;padding:6px 10px;font-size:13px;border-bottom:1px solid rgba(85,34,92,.5)}
  .pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl .cb{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.06em}
  .pl .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:1px 4px;border:1px solid currentColor}
  .pl .sc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--white);min-width:18px;text-align:right}
  .pl.all{color:var(--green)}
  .pl.solo{color:var(--pink)}
  .pl.bench{opacity:.55}
  .pl.bench .nm{font-style:italic}
  .divider{padding:5px 10px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);background:rgba(85,34,92,.35)}
  .key{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
  .key i{font-style:normal;display:inline-block;width:9px;height:9px;margin-right:6px}
  .k3{background:var(--green)}.k1{background:var(--pink)}
  .verdict{margin-top:18px;border-left:3px solid var(--cyan);padding:2px 0 2px 14px;font-size:14px;line-height:1.55;color:var(--dim)}
  .verdict b{color:var(--white);font-weight:600}

  .status{background:var(--pink);color:var(--white);padding:14px 32px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6}
  @media(max-width:600px){.status{padding:14px 20px}}
  .loading{padding:60px 32px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}

  footer{padding:22px 32px 26px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.7;color:var(--dim)}
  @media(max-width:600px){footer{padding:20px}}
  footer b{color:var(--cyan);font-weight:400}
  footer a{color:var(--cyan)}
</style>
</head>
<body>
<div class="sheet">

  <header class="pad">
    <div class="crestrow">
      <img class="crest" src="logo.png" alt="League of Legends fantasy football crest">
      <div>
        <div class="eyebrow" id="eyebrow">Fantasy Premier League</div>
        <h1>League of<br><em>Legends</em></h1>
        <p class="sub" id="sub">Loading the league…</p>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </header>

  <div id="status"></div>
  <div id="content"><div class="loading">Loading data.json…</div></div>

  <footer>
    <span id="source">Source: FPL API.</span><br>
    <span id="stamp"></span>
  </footer>

</div>

<script>
const POS_ORDER = {GKP:0, DEF:1, MID:2, FWD:3};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc = (a, b) => Math.round(a / b * 100);
let DATA = null;

fetch('data.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('data.json returned ' + r.status); return r.json(); })
  .then(d => { DATA = d; render(d); })
  .catch(e => {
    $('content').innerHTML = '<div class="loading">Could not load data.json.<br>' + esc(e.message) +
      '<br><br>Run: python3 fetch_data.py &lt;league_id&gt;</div>';
    $('sub').textContent = 'No data yet.';
  });

function render(d) {
  const M = d.managers, N = M.length;
  if (!N) { $('content').innerHTML = '<div class="loading">No manager picks available for this gameweek yet.</div>'; return; }

  // ---------- derived ----------
  const own = {};            // player -> count
  const clubs = {};          // club -> picks
  M.forEach(m => {
    new Set(m.picks.map(p => p.n)).forEach(n => own[n] = (own[n] || 0) + 1);
    m.picks.forEach(p => clubs[p.c] = (clubs[p.c] || 0) + 1);
  });
  const meta = {};
  M.forEach(m => m.picks.forEach(p => meta[p.n] = p));

  const caps = {};
  M.forEach(m => { const c = m.picks.find(p => p.C); if (c) caps[c.n] = (caps[c.n] || 0) + 1; });
  const capList = Object.entries(caps).sort((a, b) => b[1] - a[1]);

  const vices = {};
  M.forEach(m => { const v = m.picks.find(p => p.V); if (v) vices[v.n] = (vices[v.n] || 0) + 1; });
  const viceList = Object.entries(vices).sort((a, b) => b[1] - a[1]);

  const boosters = M.filter(m => m.chip === 'bboost');
  const chipCount = {};
  M.forEach(m => { if (m.chip) chipCount[m.chip] = (chipCount[m.chip] || 0) + 1; });

  M.forEach(m => {
    m.avgOwn = m.picks.reduce((a, p) => a + own[p.n], 0) / m.picks.length / N * 100;
    m.solos = m.picks.filter(p => own[p.n] === 1).length;
    m.set = new Set(m.picks.map(p => p.n));
    m.livePts = m.picks.reduce((a, p) => a + p.pts * p.m, 0) - (m.hits || 0);
  });

  // closest and furthest pairs
  let pairs = [];
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    let n = 0; M[j].picks.forEach(p => { if (M[i].set.has(p.n)) n++; });
    pairs.push({a: M[i], b: M[j], n});
  }
  pairs.sort((x, y) => y.n - x.n);

  const distinct = Object.keys(own).length;
  const solos = Object.values(own).filter(v => v === 1).length;
  const started = d.event.started;

  // ---------- header ----------
  $('eyebrow').textContent = 'Fantasy Premier League · ' + d.event.name;
  $('sub').textContent = started
    ? 'Live. Points update whenever the data refreshes.'
    : 'Everyone\u2019s teamsheets, before a ball is kicked.';
  $('meta').innerHTML = [
    [N, 'Managers'], [N * 15, 'Picks'], [distinct, 'Players used'], [solos, 'Owned by one']
  ].map(([f, l]) => '<div><span class="fig">' + f.toLocaleString() + '</span><span class="lab">' + l + '</span></div>').join('');

  $('status').innerHTML = started && !d.event.finished
    ? '<div class="status">Gameweek in progress. Points below are live and will move.</div>'
    : (!started ? '<div class="status">Pre-deadline snapshot. No scores here, only choices.</div>' : '');

  let H = '';

  // ---------- standings ----------
  if (started) {
    const table = M.slice().sort((a, b) => b.livePts - a.livePts);
    let rank = 0, prev = null, shown = 0;
    H += sec('01', 'Where it stands', '<table><thead><tr><th></th><th>Manager</th><th>GW</th></tr></thead><tbody>' +
      table.map(m => {
        shown++; if (m.livePts !== prev) { rank = shown; prev = m.livePts; }
        return '<tr' + (m.entry === d.you ? ' class="you"' : '') + '><td class="pos">' + rank + '</td><td>' + esc(m.name) +
          (m.entry === d.you ? '<span class="me">YOU</span>' : '') +
          (m.chip ? '<span class="chip">' + chipName(m.chip) + '</span>' : '') +
          '<span class="tm">' + esc(m.team) + '</span></td><td class="pts">' + m.livePts + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<p class="body">Live gameweek points, hits deducted. Not final until every fixture is done.</p>');
  }

  // ---------- captaincy ----------
  const top = capList.slice(0, 3);
  const restN = capList.slice(3).reduce((a, c) => a + c[1], 0);
  const shades = ['var(--green)', 'var(--pink)', 'var(--cyan)'];
  const inks = ['var(--purple)', 'var(--white)', 'var(--purple)'];
  let band = top.map(([n, c], i) =>
    '<div style="flex:' + c + ';background:' + shades[i] + ';color:' + inks[i] + '">' +
    '<span class="nm">' + esc(n) + '</span><span class="pc">' + c + ' · ' + pc(c, N) + '%</span></div>').join('');
  if (restN) band += '<div style="flex:' + restN + ';background:var(--purple-deep)"><span class="nm">+' + restN +
    '</span><span class="pc">' + pc(restN, N) + '%</span></div>';

  H += sec('02', 'The armband', '<div class="band">' + band + '</div>' +
    '<p class="bandnote">' + (capList.length > 3
      ? 'The other ' + restN + ': ' + capList.slice(3).map(([n, c]) => '<b>' + esc(n) + '</b>' + (c > 1 ? ' (' + c + ')' : '')).join(', ') + '. '
      : '') +
    'Vice leans <b>' + esc(viceList[0][0]) + '</b> on ' + viceList[0][1] + '.</p>');

  // ---------- ownership ----------
  const ranked = Object.entries(own).sort((a, b) => b[1] - a[1]).slice(0, 10);
  H += sec('03', 'Most owned', ranked.map(([n, c]) =>
    '<div class="row"><div class="who">' + esc(n) + ' <i>' + esc(meta[n].c) + '</i></div>' +
    '<div class="track"><div class="fill" style="width:' + pc(c, N) + '%"></div></div>' +
    '<div class="pc">' + pc(c, N) + '%</div></div>').join('') + youLine(M, own, N, d));

  // ---------- twins ----------
  const t = pairs[0];
  H += sec('04', t.n === 15 ? 'The twins' : 'Closest squads',
    '<div class="outlier"><div class="hd">' + esc(t.a.name) + ' and ' + esc(t.b.name) +
    (t.n === 15 ? ' picked the <span>same fifteen players</span>.' : ' share <span>' + t.n + ' of fifteen</span>.') +
    '</div><div class="xi">' + t.a.picks.map(p =>
      '<span' + (t.b.set.has(p.n) ? ' style="border-color:var(--green);color:var(--green)"' : '') + '>' +
      esc(p.n) + (p.C ? ' ©' : p.V ? ' (v)' : '') + '</span>').join('') + '</div>' +
    '<p class="body">' + esc(t.a.team) + ' and ' + esc(t.b.team) + '. Green means both own them.</p></div>');

  // ---------- chips and mavericks ----------
  const diff = M.slice().sort((a, b) => a.avgOwn - b.avgOwn).slice(0, 5);
  const temp = M.slice().sort((a, b) => b.avgOwn - a.avgOwn).slice(0, 5);
  const bbBench = {};
  boosters.forEach(m => m.picks.slice(11).forEach(p => bbBench[p.n] = (bbBench[p.n] || 0) + 1));
  const bbTop = Object.entries(bbBench).sort((a, b) => b[1] - a[1]).slice(0, 4);

  H += '<section class="pad"><div class="cols"><div>' +
    '<h2><span class="n">05</span>Chips played</h2>' +
    '<div class="stat">' + boosters.length + ' <small>of ' + N + '</small></div>' +
    '<p class="body">' + (boosters.length
      ? 'On the bench boost' + (bbTop.length ? ', most often carrying <b>' + bbTop.map(([n, c]) => esc(n) + ' (' + c + ')').join(', ') + '</b>' : '') + '.'
      : 'Nobody has played the bench boost.') +
    (Object.keys(chipCount).filter(c => c !== 'bboost').length
      ? ' Others: ' + Object.entries(chipCount).filter(([c]) => c !== 'bboost').map(([c, n]) => chipName(c) + ' ' + n).join(', ') + '.'
      : '') + '</p></div><div>' +
    '<h2><span class="n">06</span>Going it alone</h2><ul class="list">' +
    diff.map(m => '<li><span>' + esc(m.name) + '<em>' + esc(m.team) + '</em></span><span>' +
      m.avgOwn.toFixed(1) + '%</span></li>').join('') + '</ul>' +
    '<p class="body">Average ownership across their fifteen. Most template: <b>' + esc(temp[0].name) +
    '</b> on ' + temp[0].avgOwn.toFixed(1) + '%.</p></div></div></section>';

  // ---------- clubs ----------
  const cl = Object.entries(clubs).sort((a, b) => b[1] - a[1]);
  const shelf = cl.slice(0, 8).concat(cl.slice(-3).reverse());
  H += sec('07', 'Club stacks', '<div class="clubs">' + shelf.map(([c, n]) =>
    '<div class="club"><b>' + n + '</b><i>' + esc(c) + '</i></div>').join('') + '</div>' +
    '<p class="body">' + esc(cl[0][0]) + ' and ' + esc(cl[1][0]) + ' are <b>' +
    pc(cl[0][1] + cl[1][1], N * 15) + '%</b> of every pick in the league.</p>');

  // ---------- head to head ----------
  H += sec('08', 'Head to head',
    '<p class="body" style="margin-top:0;margin-bottom:18px">Pick two managers and compare squads. Bench players are italic and faded.</p>' +
    '<div class="cmpwrap"><div class="cmpgrid">' +
    '<div class="col"><select id="s0" aria-label="First manager"></select><div class="colhead" id="h0"></div><div id="b0"></div></div>' +
    '<div class="col"><select id="s1" aria-label="Second manager"></select><div class="colhead" id="h1"></div><div id="b1"></div></div>' +
    '</div></div><div class="key"><span><i class="k3"></i>Both</span><span><i class="k1"></i>Only them</span>' +
    '<span>C captain · V vice</span></div><div class="verdict" id="verdict"></div>');

  $('content').innerHTML = H;

  // ---------- footer ----------
  $('source').innerHTML = 'Source: FPL API, ' + esc(d.league.name) + ' (' + d.league.id + '), ' +
    esc(d.event.name) + ', ' + N + ' managers.';
  const g = new Date(d.generated);
  $('stamp').innerHTML = 'Data refreshed ' + g.toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'}) +
    '. <a href="https://fantasy.premierleague.com/leagues/' + d.league.id + '/standings/c">Open the league</a>';

  wireCompare(M, own, N);
}

function youLine(M, own, N, d) {
  const me = M.find(m => m.entry === d.you);
  if (!me) return '';
  const mine = me.picks.map(p => p.n);
  const rare = mine.slice().sort((a, b) => own[a] - own[b])[0];
  const missing = Object.entries(own).sort((a, b) => b[1] - a[1])
    .filter(([n]) => !me.set.has(n)).slice(0, 3).map(([n, c]) => esc(n) + ' (' + pc(c, N) + '%)');
  return '<p class="body">You (<b>' + esc(me.team) + '</b>) average <b>' +
    me.avgOwn.toFixed(1) + '%</b> ownership. Your rarest pick is <b>' + esc(rare) +
    '</b> on ' + pc(own[rare], N) + '%.' +
    (missing.length ? ' Most owned players you skipped: <b>' + missing.join(', ') + '</b>.' : '') + '</p>';
}

function chipName(c) {
  return {bboost: 'BB', '3xc': 'TC', freehit: 'FH', wildcard: 'WC', manager: 'AM'}[c] || c.toUpperCase();
}

function sec(n, title, inner) {
  return '<section class="pad"><h2><span class="n">' + n + '</span>' + title + '</h2>' + inner + '</section>';
}

function wireCompare(M, own, N) {
  const byName = {};
  M.forEach(m => byName[m.name] = m);
  const names = M.map(m => m.name).sort((a, b) => a.localeCompare(b));
  const sels = [0, 1].map(i => $('s' + i));
  const started = DATA.event.started;

  sels.forEach((sel, i) => {
    names.forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n + ' \u2014 ' + byName[n].team;
      sel.appendChild(o);
    });
    const mine = (M.find(m => m.entry === DATA.you) || {}).name;
    sel.value = (i === 0 && mine) ? mine : names.find(n => n !== (mine || '')) || names[0];
    if (i === 0 && !mine) sel.value = names[0];
    sel.addEventListener('change', draw);
  });

  function draw() {
    const pick = sels.map(s => byName[s.value]);
    pick.forEach((m, i) => {
      const other = pick[1 - i].set;
      const avg = (m.picks.reduce((a, p) => a + own[p.n], 0) / m.picks.length / N * 100).toFixed(0);
      $('h' + i).innerHTML = '<span>' + esc(m.team) + '</span><span>' +
        (started ? '<b>' + m.livePts + '</b> pts · ' : '') + avg + '% own</span>';

      let html = '', bench = false;
      m.picks.forEach(p => {
        if (!p.s && !bench) { html += '<div class="divider">Bench</div>'; bench = true; }
        html += '<div class="pl ' + (other.has(p.n) ? 'all' : 'solo') + (p.s ? '' : ' bench') + '">' +
          '<span class="nm">' + esc(p.n) + '</span>' +
          (p.C ? '<span class="tag">C</span>' : p.V ? '<span class="tag">V</span>' : '') +
          '<span class="cb">' + esc(p.c) + '</span>' +
          (started ? '<span class="sc">' + (p.pts * p.m) + '</span>' : '') + '</div>';
      });
      $('b' + i).innerHTML = html;
    });

    if (pick[0] === pick[1]) { $('verdict').innerHTML = 'Same manager twice. Pick two different ones.'; return; }
    const shared = pick[0].picks.filter(p => pick[1].set.has(p.n)).length;
    const only = i => pick[i].picks.filter(p => !pick[1 - i].set.has(p.n)).map(p => esc(p.n));
    const cap = pick.map(m => (m.picks.find(p => p.C) || {n: '?'}).n);
    let v = 'They share <b>' + shared + '</b> of fifteen. ' +
      esc(pick[0].name) + ' alone: ' + (only(0).length ? '<b>' + only(0).join(', ') + '</b>' : 'nobody') + '. ' +
      esc(pick[1].name) + ' alone: ' + (only(1).length ? '<b>' + only(1).join(', ') + '</b>' : 'nobody') + '. ' +
      (cap[0] === cap[1] ? 'Same captain, <b>' + esc(cap[0]) + '</b>, so the armband cancels out.'
        : 'Captains split: <b>' + esc(cap[0]) + '</b> against <b>' + esc(cap[1]) + '</b>.');
    if (started) v += ' Gameweek so far: <b>' + pick[0].livePts + '</b> against <b>' + pick[1].livePts + '</b>.';
    $('verdict').innerHTML = v;
  }
  draw();
}
</script>

</html>
